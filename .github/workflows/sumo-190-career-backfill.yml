name: BEFN Sumo 190-rikishi research backfill (every 5 minutes)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sumo-190-career-backfill.yml
  schedule:
    # GitHub Actions scheduled workflows run from the DEFAULT branch only.
    # The job itself checks out and writes ONLY the isolated research branch.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: befn-sumo-190-career-cache-single-writer
  cancel-in-progress: false

jobs:
  research-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Skip expensive scheduled work after all 190 API histories are collected
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if json=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/sumo/backfill/v1/summary.json?ref=research/sumo-190-career-cache-20261114" --jq '.content' | tr -d '\n' | base64 -d); then
            if printf '%s' "$json" | jq -e '.cohortSize==190 and .counts.collected==190 and .counts.pending==0 and .counts.partial==0 and .counts.exception==0' > /dev/null; then
              if official=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/sumo/backfill/v1/jsa-public/summary.json?ref=research/sumo-190-career-cache-20261114" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d); then
                if printf '%s' "$official" | jq -e '.cohort==190 and .pending==0' > /dev/null; then
                  echo 'run=false' >> "$GITHUB_OUTPUT"
                  echo 'All API histories and JSA public profile snapshots complete; skipping redundant schedule.'
                  exit 0
                fi
              fi
              echo 'API histories complete; public JSA verification still pending.'
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Check out research branch, never main or the Render test branch
        if: steps.preflight.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: research/sumo-190-career-cache-20261114
          # Fetch recent branch history only; the full repo clone wastes most
          # of the runner window and contributes nothing to API collection.
          fetch-depth: 5
          persist-credentials: true
      - name: Install Node 22
        if: steps.preflight.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded source backfill
        if: steps.preflight.outputs.run == 'true'
        run: |
          node --check scripts/sumo-backfill-190.mjs
          node --check scripts/sumo-verify-190.mjs
          node --check scripts/sumo-jsa-reconcile.mjs
          node --check scripts/sumo-build-profile-cache.mjs
          node --check scripts/sumo-jsa-public-spotcheck.mjs
          node --check scripts/sumo-official-bout-corrections.mjs
          node --test tests/test-sumo-backfill-190.mjs tests/test-sumo-verify-190.mjs tests/test-sumo-jsa-reconcile.mjs tests/test-sumo-build-profile-cache.mjs tests/test-sumo-jsa-public-spotcheck.mjs tests/test-sumo-official-bout-corrections.mjs
      - name: Collect only missing research data
        if: steps.preflight.outputs.run == 'true'
        env:
          # One coordinated worker uses the available GitHub runner window,
          # not an arbitrary fixed API-call budget.
          SUMO_WORK_SECONDS: '165'
          SUMO_REQUEST_INTERVAL_MS: '200'
        run: node scripts/sumo-backfill-190.mjs
      - name: Audit collected history before any future JSA certification
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-verify-190.mjs
      - name: Reconcile public JSA spotchecks without certifying careers
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-jsa-reconcile.mjs
      - name: Build complete research-only profile projections
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-build-profile-cache.mjs
      - name: Source-check public JSA profile fields without certifying careers
        if: steps.preflight.outputs.run == 'true'
        env:
          SUMO_JSA_REQUESTS_PER_RUN: '6'
          SUMO_JSA_INTERVAL_MS: '2000'
        run: node scripts/sumo-jsa-public-spotcheck.mjs
      - name: Checkpoint cached results on research branch only
        if: steps.preflight.outputs.run == 'true'
        env:
          TARGET_BRANCH: research/sumo-190-career-cache-20261114
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEFN Sumo research cache"
          git config user.email "sumo-research@users.noreply.github.com"
          git add data/sumo/backfill/v1/
          if git diff --cached --quiet; then
            echo "No missing stages or new records: no commit and no repeated API work."
            exit 0
          fi
          git commit -m "Research: checkpoint verified API response pages, not fighter certification [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Checkpoint pushed exclusively to $TARGET_BRANCH"
              exit 0
            fi
            sleep 3
          done
          echo "Could not push checkpoint without losing another writer's changes." >&2
          exit 1
