name: BEFN Sumo 190-rikishi research backfill (every 5 minutes)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sumo-190-career-backfill.yml
  schedule:
    # GitHub Actions scheduled workflows run from the DEFAULT branch only.
    # The job itself checks out and writes ONLY the isolated research branch.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: befn-sumo-190-career-cache-single-writer
  cancel-in-progress: false

jobs:
  research-backfill:
    runs-on: ubuntu-latest
    # QA, JSA verification and historical-weight requests run sequentially.
    # The collector itself is bounded to 160 seconds; allow the remaining
    # checks + git checkpoint to finish rather than losing a good research pass.
    timeout-minutes: 7
    steps:
      - name: Skip expensive scheduled work after all 190 API histories are collected
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if json=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/sumo/backfill/v1/summary.json?ref=research/sumo-190-career-cache-20261114" --jq '.content' | tr -d '\n' | base64 -d); then
            if printf '%s' "$json" | jq -e '.cohortSize==190 and .counts.collected==190 and .counts.pending==0 and .counts.partial==0 and .counts.exception==0' > /dev/null; then
              echo 'histories_complete=true' >> "$GITHUB_OUTPUT"
              if official=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/sumo/backfill/v1/jsa-public/summary.json?ref=research/sumo-190-career-cache-20261114" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d); then
                if printf '%s' "$official" | jq -e '.cohort==190 and .pending==0' > /dev/null; then
                  # Completion of public profile collection does not mean
                  # one-time historical-rank crosschecks are complete. Legacy
                  # cached profiles require a bounded, source-backed recheck.
                  # Missing progress metadata also mandates a single pass to
                  # build the new checkpoint; never assume null equals done.
                  if ! printf '%s' "$official" | jq -e '.historicalRankRechecksOutstanding == 0' >/dev/null 2>&1; then
                    echo 'run=true' >> "$GITHUB_OUTPUT"
                    echo 'Official historical rank verification still outstanding; no API-history recollection.'
                    exit 0
                  fi
                  # If SumoDB owner consent is obtained, keep the same
                  # isolated worker collecting permitted historical weights.
                  policy=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/sumo/backfill/v1/sumodb-use-policy.json?ref=research/sumo-190-career-cache-20261114" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d || true)
                  if printf '%s' "$policy" | jq -e '.approvedForAutomatedCollection==true and (.approvalEvidence|type=="string" and length>=12)' >/dev/null 2>&1; then
                    coverage=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/sumo/backfill/v1/weight-source-coverage.json?ref=research/sumo-190-career-cache-20261114" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d || true)
                    if ! printf '%s' "$coverage" | jq -e '.mappedSumoDbRikishi>=1 and .checkedIndependentRikishi>=.mappedSumoDbRikishi' >/dev/null 2>&1; then
                      echo 'run=true' >> "$GITHUB_OUTPUT"
                      echo 'Official JSA profiles complete; permitted SumoDB historical weight collection remains.'
                      exit 0
                    fi
                    # Continue independent published career W-L-A checks only
                    # for still-blocked wrestlers. Once each eligible profile
                    # has a cached one-time evidence result, stop that lane.
                    # An absent count is treated as incomplete on the first run.
                    provider=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/sumo/backfill/v1/sumodb-collection-status.json?ref=research/sumo-190-career-cache-20261114" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d || true)
                    if ! printf '%s' "$provider" | jq -e '.careerRecordCrosschecksOutstanding == 0' >/dev/null 2>&1; then
                      echo 'run=true' >> "$GITHUB_OUTPUT"
                      echo 'One-time independent SumoDB career totals checks still outstanding.'
                      exit 0
                    fi
                  fi
                  echo 'run=false' >> "$GITHUB_OUTPUT"
                  echo 'All eligible work completed or SumoDB automated reuse permission not documented.'
                  exit 0
                fi
              fi
              echo 'API histories complete; public JSA verification still pending.'
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Check out research branch, never main or the Render test branch
        if: steps.preflight.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: research/sumo-190-career-cache-20261114
          # Fetch recent branch history only; the full repo clone wastes most
          # of the runner window and contributes nothing to API collection.
          fetch-depth: 5
          persist-credentials: true
      - name: Install Node 22
        if: steps.preflight.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded source backfill
        id: validation
        if: steps.preflight.outputs.run == 'true'
        run: |
          node --check scripts/sumo-backfill-190.mjs
          node --check scripts/sumo-verify-190.mjs
          node --check scripts/sumo-jsa-reconcile.mjs
          node --check scripts/sumo-build-profile-cache.mjs
          node --check scripts/sumo-audit-h2h-chronology.mjs
          node --check scripts/sumo-export-preview-h2h.mjs
          bash -n scripts/sumo-sync-h2h-preview.sh
          bash -n scripts/sumo-sync-licensed-photos-preview.sh
          bash -n scripts/sumo-verify-preview-build.sh
          node --check scripts/sumo-jsa-public-spotcheck.mjs
          node --check scripts/sumo-jsa-reconcile-measurement-precision.mjs
          node --check scripts/sumo-jsa-corrected-basho-audit.mjs
          node --check scripts/sumo-research-run-health.mjs
          node --check assets/sumo-career.mjs
          node --check scripts/sumo-export-preview-career.mjs
          node --check scripts/sumo-webpage-readiness-190.mjs
          node --check scripts/sumo-certification-preflight-190.mjs
          node --check scripts/sumo-certify-strict-190.mjs
          node --check scripts/sumo-stage-cc-photos-preview.mjs
          node --check scripts/sumo-check-live-preview.mjs
          node --check scripts/sumo-jsa-history-exceptions.mjs
          node --check scripts/sumo-weight-history-190.mjs
          node --check scripts/sumo-weight-sumodb-collector.mjs
          node --check scripts/sumo-official-bout-corrections.mjs
          node --check scripts/sumo-official-career-totals.mjs
          node --test tests/test-sumo-backfill-190.mjs tests/test-sumo-verify-190.mjs tests/test-sumo-jsa-reconcile.mjs tests/test-sumo-build-profile-cache.mjs tests/test-sumo-h2h-chronology.mjs tests/test-sumo-jsa-public-spotcheck.mjs tests/test-sumo-jsa-reconcile-measurement-precision.mjs tests/test-sumo-jsa-corrected-basho-audit.mjs tests/test-sumo-research-run-health.mjs tests/test-sumo-career-no-synthetic-weights.mjs tests/test-sumo-export-preview-career.mjs tests/test-sumo-webpage-readiness-190.mjs tests/test-sumo-certification-preflight-190.mjs tests/test-sumo-certify-strict-190.mjs tests/test-sumo-stage-cc-photos-preview.mjs tests/test-sumo-check-live-preview.mjs tests/test-sumo-jsa-history-exceptions.mjs tests/test-sumo-weight-history-190.mjs tests/test-sumo-weight-sumodb-collector.mjs tests/test-sumo-official-bout-corrections.mjs tests/test-sumo-official-career-totals.mjs
      - name: Collect only missing API histories
        if: steps.preflight.outputs.run == 'true' && steps.preflight.outputs.histories_complete != 'true'
        env:
          # One coordinated worker uses the available GitHub runner window,
          # not an arbitrary fixed API-call budget.
          SUMO_WORK_SECONDS: '165'
          SUMO_REQUEST_INTERVAL_MS: '200'
        run: node scripts/sumo-backfill-190.mjs
      - name: Audit collected history before any future JSA certification
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-verify-190.mjs
      - name: Reconcile public JSA spotchecks without certifying careers
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-jsa-reconcile.mjs
      - name: Reconstruct every opponent H2H meeting and audit each winning technique
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-audit-h2h-chronology.mjs
      - name: Validate all 190 chronology projections and export efficient preview H2H cache
        if: steps.preflight.outputs.run == 'true'
        run: |
          node --test tests/test-sumo-export-preview-h2h.mjs
          node scripts/sumo-export-preview-h2h.mjs
      - name: Source-check public JSA profile fields without certifying careers
        id: official_jsa
        if: steps.preflight.outputs.run == 'true'
        env:
          SUMO_JSA_REQUESTS_PER_RUN: '16'
          SUMO_JSA_INTERVAL_MS: '2000'
        run: node scripts/sumo-jsa-public-spotcheck.mjs
      - name: Reconcile JSA rounded listed measurements without changing cached source values
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-jsa-reconcile-measurement-precision.mjs
      - name: Apply already verified official bout outcomes to JSA audit comparisons
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-jsa-corrected-basho-audit.mjs
      # Account for historically truncated public JSA profiles in the existing
      # research exception register; these missing bouts remain uncertified.
      - name: Rebuild itemised JSA historical exception register without new requests
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-jsa-history-exceptions.mjs
      # Reuses the same authorised paced SumoDB source worker for one-time
      # W-L-A career crosschecks and old basho rows missing from truncated
      # JSA public profiles. Never replaces original dates, weights or scores.
      - name: Collect independent historical weights only if source permissions are documented
        id: weight_collector
        if: steps.preflight.outputs.run == 'true'
        env:
          # Up to ten pages per pass, four per minute, with a strict 160s
          # collector deadline so checkout, QA and checkpoint can finish.
          SUMODB_MAX_PER_RUN: '10'
        run: node scripts/sumo-weight-sumodb-collector.mjs
      - name: Refresh dated weight-source coverage without external requests
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-weight-history-190.mjs
      - name: Build complete research-only profile projections
        id: profile_builder
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-build-profile-cache.mjs
      # Use the same minimum official rank-history coverage in fast-lane
      # classification as in the independent strict career-result audit.
      - name: Classify source-complete Sumo histories for strict certification audit without issuing certificates
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-certification-preflight-190.mjs

      # Older ranks may use independently dated, exactly matched SumoDB
      # numbered banzuke positions when the public JSA extract is truncated;
      # source overlaps must match and all unmatched ranks stay explicitly null.
      # One canonical research audit after provider evidence collection and
      # JSA preflight. The gate fails on a lost prior certificate, even when
      # the total count rises. Documented unpublished debut ranks remain null;
      # alternative SumoDB W-L-A may fill omitted, never conflicting, JSA data.
      - name: Strictly audit all 190 career-result histories against independent saved evidence
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-certify-strict-190.mjs

      - name: Audit all 190 Sumo webpage data fields and photo rights before certification
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-webpage-readiness-190.mjs
      - name: Export 190 sourced Sumo weight and rank timelines for test preview
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-export-preview-career.mjs
      - name: Compare published Sumo test data with saved research export
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: node scripts/sumo-check-live-preview.mjs

      - name: Save auditable successful Sumo research run checkpoint
        id: health_snapshot
        if: steps.preflight.outputs.run == 'true'
        run: node scripts/sumo-research-run-health.mjs
      - name: Checkpoint cached results on research branch only
        id: research_push
        if: steps.preflight.outputs.run == 'true'
        env:
          TARGET_BRANCH: research/sumo-190-career-cache-20261114
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEFN Sumo research cache"
          git config user.email "sumo-research@users.noreply.github.com"
          git add data/sumo/backfill/v1/ data/sumo/exports/
          if git diff --cached --quiet; then
            echo "No missing stages or new records: no commit and no repeated API work."
            exit 0
          fi
          git commit -m "Research: checkpoint verified API response pages, not fighter certification [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Checkpoint pushed exclusively to $TARGET_BRANCH"
              exit 0
            fi
            sleep 3
          done
          echo "Could not push checkpoint without losing another writer's changes." >&2
          exit 1

      - name: Sync approved source-backed H2H preview to isolated test branch only
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: bash scripts/sumo-sync-h2h-preview.sh

      - name: Stage strictly licensed wrestler portraits only to isolated Sumo preview branch
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: bash scripts/sumo-sync-licensed-photos-preview.sh

      - name: Validate isolated Sumo test branch with Render-equivalent build tests
        id: preview_qa
        if: steps.preflight.outputs.run == 'true'
        shell: bash
        run: bash scripts/sumo-verify-preview-build.sh

      - name: Record failed research job stage for diagnosis
        if: ${{ failure() && steps.preflight.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: research/sumo-190-career-cache-20261114
          VALIDATE_STATUS: ${{ steps.validation.outcome }}
          OFFICIAL_STATUS: ${{ steps.official_jsa.outcome }}
          WEIGHTS_STATUS: ${{ steps.weight_collector.outcome }}
          PROFILE_STATUS: ${{ steps.profile_builder.outcome }}
          HEALTH_STATUS: ${{ steps.health_snapshot.outcome }}
          PUSH_STATUS: ${{ steps.research_push.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          path='data/sumo/backfill/v1/workflow-last-failure.json'
          stamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          payload=$(jq -n --arg at "$stamp" --arg run "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" --arg check "$VALIDATE_STATUS" \
            --arg jsa "$OFFICIAL_STATUS" --arg weights "$WEIGHTS_STATUS" \
            --arg profiles "$PROFILE_STATUS" --arg health "$HEALTH_STATUS" \
            --arg push "$PUSH_STATUS" \
            '{schemaVersion:1,status:"research-run-incomplete",at:$at,
              runId:$run,workflowCommit:$sha,
              actionsUrl:("https://github.com/lukejelkins-beep/Black-Eye-Fight-News/actions/runs/"+$run),
              stepOutcomes:{validation:$check,officialJsa:$jsa,
                sumoDbCollector:$weights,profileBuild:$profiles,
                healthCheckpoint:$health,gitPush:$push},
              note:"This is an incomplete Actions run. Do not advance certification or claim a completed checkpoint."}')
          encoded=$(printf '%s\n' "$payload" | base64 -w0)
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=$TARGET_BRANCH" --jq '.sha' 2>/dev/null || true)
          args=(-f "message=Research: flag incomplete Sumo worker run [skip ci]"
            -f "branch=$TARGET_BRANCH" -f "content=$encoded")
          if [[ -n "$existing" ]]; then args+=(-f "sha=$existing"); fi
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" "${args[@]}" ||
            echo 'Could not persist failed-run marker; consult Actions logs for run ID.' >&2
