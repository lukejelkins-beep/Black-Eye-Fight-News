name: Independently certify Abdul Hussein UFC full career (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/ufc-independent-full-career-verification.json'
      - 'scripts/verify-ufc-v4-abdul-hussein-certification.mjs'
      - '.github/workflows/verify-ufc-v4-abdul-hussein-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-career-certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run independent career evidence safeguards
        run: node --test tests/test-ufc-36-month-stage3-progress.mjs
      - name: Verify official and Greco source-linked bout against saved native identity, outcome and full round metrics
        run: node scripts/verify-ufc-v4-abdul-hussein-certification.mjs
      - name: Preserve evidence outside production
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-v4-abdul-hussein-first-complete-career
          path: qa/ufc-v4-abdul-hussein-certified-career.json
          retention-days: 30
          if-no-files-found: error
