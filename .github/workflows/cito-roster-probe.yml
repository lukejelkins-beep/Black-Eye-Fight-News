name: Cito roster probe (temporary, PR only)
# Read-only, three requests, to learn what Cito's fighters list returns before a
# roster refresh is written. Uses only UFC_STATS_API_CITO. Stays inside the
# archive's self-imposed limits (9 per run, 120 per 30 days). Does not touch the
# collector-owned usage ledger. Delete this workflow once the shape is known.
on:
  pull_request:
    paths:
      - '.github/workflows/cito-roster-probe.yml'
permissions:
  contents: read
concurrency:
  group: befn-cito-roster-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      UFC_STATS_API_CITO: ${{ secrets.UFC_STATS_API_CITO }}
    steps:
      - name: Probe fighters list and rankings (max 7 requests)
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get("UFC_STATS_API_CITO", "").strip()
          if not key:
              raise SystemExit("secret missing; nothing requested")
          base = "https://api.citoapi.com/api/v1/"
          calls = 0
          def get(path):
              global calls
              calls += 1
              assert calls <= 7
              req = urllib.request.Request(base + path, headers={"x-api-key": key, "Accept": "application/json", "User-Agent": "BEFN-roster-probe/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, dict(r.headers), json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), {}
          def shape(o, depth=0):
              if isinstance(o, dict):
                  return {k: shape(v, depth + 1) if depth < 2 else type(v).__name__ for k, v in list(o.items())[:30]}
              if isinstance(o, list):
                  return [len(o), shape(o[0], depth + 1) if o else None]
              return o if isinstance(o, (int, float, bool)) or o is None else (o[:40] if isinstance(o, str) else type(o).__name__)
          import base64, gzip
          out, total, pages = [], None, 0
          page = 1
          while page <= 7:
              status, headers, body = get("ufc/fighters?limit=500&page=%d" % page)
              print("page", page, "HTTP", status, "remaining", headers.get("X-RateLimit-Monthly-Remaining"))
              if status in (401, 403, 429) or not isinstance(body, dict):
                  print("stopping:", status); break
              rows = body.get("data") or []
              meta = body.get("meta") or {}
              total = meta.get("total")
              for r in rows:
                  out.append([r.get("slug"), r.get("name"), r.get("division"), r.get("status"), r.get("isActive"), r.get("championStatus")])
              pages += 1
              if not meta.get("hasNextPage"):
                  break
              page += 1
          print("pages", pages, "rows", len(out), "total", total)
          active = [r for r in out if r[4] is True]
          print("active", len(active), "with division", len([r for r in active if r[2]]))
          blob = base64.b64encode(gzip.compress(json.dumps(active, separators=(",", ":")).encode(), 9)).decode()
          for i in range(0, len(blob), 3000):
              print("B64 " + blob[i:i + 3000])
          print("requests made:", calls)
          PY
