name: Cito roster probe (temporary, PR only)
# Read-only, three requests, to learn what Cito's fighters list returns before a
# roster refresh is written. Uses only UFC_STATS_API_CITO. Stays inside the
# archive's self-imposed limits (9 per run, 120 per 30 days). Does not touch the
# collector-owned usage ledger. Delete this workflow once the shape is known.
on:
  pull_request:
    paths:
      - '.github/workflows/cito-roster-probe.yml'
permissions:
  contents: read
concurrency:
  group: befn-cito-roster-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      UFC_STATS_API_CITO: ${{ secrets.UFC_STATS_API_CITO }}
    steps:
      - name: Probe fighters list and rankings (max 3 requests)
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get("UFC_STATS_API_CITO", "").strip()
          if not key:
              raise SystemExit("secret missing; nothing requested")
          base = "https://api.citoapi.com/api/v1/"
          calls = 0
          def get(path):
              global calls
              calls += 1
              assert calls <= 3
              req = urllib.request.Request(base + path, headers={"x-api-key": key, "Accept": "application/json", "User-Agent": "BEFN-roster-probe/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, dict(r.headers), json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), {}
          def shape(o, depth=0):
              if isinstance(o, dict):
                  return {k: shape(v, depth + 1) if depth < 2 else type(v).__name__ for k, v in list(o.items())[:30]}
              if isinstance(o, list):
                  return [len(o), shape(o[0], depth + 1) if o else None]
              return o if isinstance(o, (int, float, bool)) or o is None else (o[:40] if isinstance(o, str) else type(o).__name__)
          stop = False
          for path in ("ufc/fighters?limit=100", "ufc/fighters?limit=2&weightClass=flyweight", "ufc/rankings"):
              if stop:
                  break
              status, headers, body = get(path)
              print("==", path, "HTTP", status, "remaining", headers.get("X-RateLimit-Monthly-Remaining"), "limit", headers.get("X-RateLimit-Monthly-Limit"))
              if status in (401, 403, 429):
                  print("stopping:", status); stop = True; continue
              print("top-level keys:", list(body.keys()) if isinstance(body, dict) else type(body).__name__)
              print("meta:", json.dumps(body.get("meta"))[:400] if isinstance(body, dict) else None)
              data = body.get("data") if isinstance(body, dict) else None
              print("data shape:", json.dumps(shape(data))[:1500])
              rows = data if isinstance(data, list) else (data.get("fighters") or data.get("items") or data.get("divisions") if isinstance(data, dict) else None)
              if isinstance(rows, list):
                  print("rows:", len(rows))
                  print("sample:", json.dumps(rows[:2])[:1200])
                  if path.startswith("ufc/fighters?limit=100"):
                      from collections import Counter
                      for field in ("weightClass", "weight_class", "division", "status", "active", "isActive"):
                          vals = Counter(str(r.get(field)) for r in rows if isinstance(r, dict) and field in r)
                          if vals: print("values of", field, dict(vals.most_common(15)))
          print("requests made:", calls)
          PY
