name: Sumo preview — apply relayed JSA torikumi email

# Runs the moment the Gmail relay (tools/gmail-torikumi-relay.gs) commits a new email into
# data/sumo/email-inbox/ on the preview branch, so next-day matchups do not wait for the
# delayed hourly schedule. Push events use this file from the preview branch itself.
on:
  push:
    branches: [feat/sumo-section-test-20261114]
    paths:
      - data/sumo/email-inbox/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sumo-preview-single-writer
  cancel-in-progress: false

jobs:
  apply-email:
    if: github.ref == 'refs/heads/feat/sumo-section-test-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sumo-section-test-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the email parser and daily selection
        run: node --test tests/test-sumo-email-torikumi.mjs tests/test-sumo-jsa.mjs tests/test-sumo-daily.mjs
      - name: Apply relayed emails, then refresh results and matchups
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sumo-email-torikumi.mjs
          node scripts/sumo-refresh-daily.mjs
          node scripts/sumo-apply-live-bouts.mjs
      - name: Commit only the preview data files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEFN Sumo daily preview"
          git config user.email "sumo-preview@users.noreply.github.com"
          git add data/sumo/jsa-torikumi.json data/sumo/preview-details.json \
            data/sumo/career-history.json data/sumo/research-h2h-summary.json \
            data/sumo/research-h2h-opponents.json data/sumo/research-h2h-history.json
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "Apply relayed JSA torikumi email to Sumo preview data"
          for attempt in 1 2 3; do
            git fetch origin feat/sumo-section-test-20261114
            if ! git rebase origin/feat/sumo-section-test-20261114; then
              git rebase --abort || true
              echo "Concurrent change conflict; leaving preview branch unchanged" >&2
              exit 1
            fi
            if git push origin HEAD:feat/sumo-section-test-20261114; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Redeploy the Sumo preview on Render
        if: steps.commit.outputs.pushed == 'true'
        env:
          HOOK: ${{ secrets.SUMO_PREVIEW_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "${HOOK:-}" ]; then
            echo "SUMO_PREVIEW_DEPLOY_HOOK_URL is not set; relying on Render auto-deploy" >&2
            exit 0
          fi
          curl -fsS --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Render preview deploy requested"
