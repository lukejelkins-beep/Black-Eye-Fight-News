name: Validate UFCalendar budget engine
on:
  pull_request:
    paths:
      - 'scripts/refresh-ufcalendar-budget.py'
      - 'tests/test_ufcalendar_budget.py'
      - '.github/workflows/test-ufcalendar-budget.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests (no API key, no external requests)
        run: |
          python -m unittest discover -s tests -p 'test_fighter_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_ufcalendar_budget.py' -v
