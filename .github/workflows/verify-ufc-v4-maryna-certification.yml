name: Verify first independently certified UFC V4 full career (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/ufc-independent-full-career-verification.json'
      - 'scripts/verify-ufc-v4-maryna-certification.mjs'
      - '.github/workflows/verify-ufc-v4-maryna-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate strict Stage 3 independent career evidence safeguards
        run: node --test tests/test-ufc-36-month-stage3-progress.mjs
      - name: Generate measured UFC career observation cache offline
        run: node scripts/build-ufc-postfight-metrics.mjs
      - name: Certify every Maryna Moroz source fight against numeric IDs, winners, dates and metrics
        run: node scripts/verify-ufc-v4-maryna-certification.mjs
      - name: Retain signed-off research evidence outside production
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-v4-first-independently-certified-career
          path: qa/ufc-v4-maryna-certified-career.json
          retention-days: 30
          if-no-files-found: error
