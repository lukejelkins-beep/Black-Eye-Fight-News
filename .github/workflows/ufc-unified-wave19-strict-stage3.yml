name: UFC wave19 Donte and Kody full cohort strict Stage3 (research only)
on:
  push:
    branches: [research/ufc-wave19-donte-kody-20261114]
    paths:
      - 'data/ufc-independent-full-career-verification.json'
      - 'data/ufc-feeder-bout-evidence.json'
      - 'tests/test-ufc-unified-wave19-donte-kody-evidence.mjs'
      - '.github/workflows/ufc-unified-wave19-strict-stage3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify two new careers, original native IDs, scorecards, feeder exclusions and prior certified fighters
        run: |
          node --test tests/test-ufc-unified-wave19-donte-kody-evidence.mjs
          node --test tests/test-ufc-unified-blake-bilder-evidence.mjs
          node --test tests/test-ufc-unified-wave16-amosov-hafez-evidence.mjs
          node --test tests/test-ufc-unified-gantt-xiong-six-evidence.mjs
          node --test tests/test-ufc-36-month-stage3-progress.mjs
          node --test tests/test-ufc-v4-certification-queue.mjs
      - name: Independently certify full unchanged 783-person original native UFC career + measured round gate
        run: |
          node scripts/ufc-36-month-stage3-progress.mjs
          node scripts/ufc-v4-certification-queue.mjs
      - name: Preserve strict Stage3 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-donte-kody-strict-full-cohort
          path: |
            qa/ufc-36-month-stage3-progress.json
            qa/ufc-v4-certification-queue.json
          if-no-files-found: warn
