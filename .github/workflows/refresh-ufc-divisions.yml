name: Refresh UFC division rosters and rankings
on:
  workflow_dispatch:
  schedule:
    # UFC rankings update after each event; refresh Tuesday and Friday.
    - cron: '41 6 * * 2,5'
  pull_request:
    # Verifies the real payload shape on changes; does not commit from a PR.
    branches: [main]
    paths:
      - 'scripts/refresh-ufc-divisions.py'
      - '.github/workflows/refresh-ufc-divisions.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: befn-ufc-divisions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test division parsing (no network)
        run: python -m unittest discover -s tests -p 'test_ufc_divisions.py' -v
      - name: Fetch 12 division pages (one quota check + 12 calls, spend guard applies)
        env:
          UFCALENDAR_API_KEY: ${{ secrets.UFCALENDAR_API_KEY }}
        run: python scripts/refresh-ufc-divisions.py
      - name: Rebuild fighter statistics with official divisions
        run: python scripts/build-ufc-stats.py
      - name: Summarise divisions for review
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/ufc-divisions.json'))
          for slug, v in d['divisions'].items():
              champ = (v.get('champion') or {}).get('name')
              print(f"{slug:22} roster {len(v['roster']):3} ranked {len(v['ranked']):2} champion {champ}  ranking {v.get('rankingDate')}")
          print('fighters with a division:', len(d['fighters']))
          print('diagnostics:', json.dumps(d['diagnostics'])[:1500])
          s = json.load(open('data/ufc-stats/index.json'))
          print('stats division coverage:', s['divisionCoverage'], 'of', len(s['fighters']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ufc-divisions
          path: data/ufc-divisions.json
      - name: Commit divisions only (statistics are rebuilt by their own workflow)
        id: commit
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp data/ufc-divisions.json "$RUNNER_TEMP/ufc-divisions.json"
          git config user.name 'BEFN division refresher'
          git config user.email 'befn-division-refresher@users.noreply.github.com'
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            # Start from the latest branch each time; this job owns only this file.
            git fetch -q origin "$branch"
            git reset -q --hard "origin/$branch"
            cp "$RUNNER_TEMP/ufc-divisions.json" data/ufc-divisions.json
            git add data/ufc-divisions.json
            if git diff --cached --quiet; then echo 'No division changes'; exit 0; fi
            git commit -q -m 'Refresh UFC division rosters, rankings and champions'
            if git push -q origin "HEAD:$branch"; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild statistics with the new divisions
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-ufc-stats.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
