name: Temporary Sumo API shape discovery
on:
  push:
    branches: [fix/sumo-new-wrestlers-20261117]
    paths: [scripts/sumo-discover-shapes.mjs]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sumo-discover-shapes.mjs
