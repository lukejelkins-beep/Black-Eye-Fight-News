name: UFC wave17 18 completed Octagon fights strict full Stage3 (research only)
on:
  push:
    branches: [research/ufc-wave17-mesquita-bondar-20261114]
    paths:
      - 'data/ufc-independent-full-career-verification.json'
      - 'data/ufc-feeder-bout-evidence.json'
      - 'data/ufc-unified-wave17-official-source-review-20261114.json'
      - 'tests/test-ufc-unified-wave17-mesquita-bondar-evidence.mjs'
      - '.github/workflows/ufc-unified-wave17-strict-stage3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-783:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect new 18 UFC fight histories, opponent aliases, DWCS feeders and prior certifications
        run: |
          node --test tests/test-ufc-unified-wave17-mesquita-bondar-evidence.mjs
          node --test tests/test-ufc-unified-wave16-amosov-hafez-evidence.mjs
          node --test tests/test-ufc-unified-gantt-xiong-six-evidence.mjs
          node --test tests/test-ufc-unified-pedro-rodrigo-evidence.mjs
          node --test tests/test-ufc-36-month-stage3-progress.mjs
          node --test tests/test-ufc-v4-certification-queue.mjs
      - name: Entire immutable 783-fighter independent source/round certification gate
        run: |
          node scripts/ufc-36-month-stage3-progress.mjs
          node scripts/ufc-v4-certification-queue.mjs
      - name: Save full audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-wave17-strict-full-cohort
          path: |
            qa/ufc-36-month-stage3-progress.json
            qa/ufc-v4-certification-queue.json
          if-no-files-found: warn
