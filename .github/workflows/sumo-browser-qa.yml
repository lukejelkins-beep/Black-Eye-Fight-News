name: Sumo desktop and mobile browser QA
on:
  push:
    branches: [feat/sumo-section-test-20261114]
    paths:
      - sumo.html
      - assets/sumo.css
      - assets/sumo.js
      - assets/sumo-data.mjs
      - assets/sumo-nav.css
      - data/sumo/**
      - scripts/sumo-browser-qa.mjs
      - .github/workflows/sumo-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sumo-browser-qa
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Serve the isolated preview and test desktop/mobile user journeys
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sumo-preview-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sumo.html -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/sumo-browser-qa.mjs
      - name: Save testing screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-sumo-desktop-mobile-screenshots
          path: qa/sumo-previews/
          retention-days: 7
          if-no-files-found: warn
