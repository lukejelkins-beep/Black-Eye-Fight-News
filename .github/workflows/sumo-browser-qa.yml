name: Sumo desktop and mobile browser QA
on:
  # Manual only for now. This journey still tests the old Sumo "Overview" home screen
  # (.sumo-overview-lede, five leaders), which no longer exists: #home now opens Results.
  # It failed at its first step on every viewport when it first ran against main
  # (2026-11-23). It runs on pull requests again once it is ported to the current design.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sumo-browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline Sumo regression and data preservation tests
        run: node --test tests/test-sumo*.mjs
      - name: Install test-only Chromium runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Serve the isolated preview and test desktop/mobile user journeys
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sumo-preview-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/sumo.html -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/sumo-browser-qa.mjs
      - name: Save testing screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-sumo-desktop-mobile-screenshots
          path: qa/sumo-previews/
          retention-days: 7
          if-no-files-found: warn
