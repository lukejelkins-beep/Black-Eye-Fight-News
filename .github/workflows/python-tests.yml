name: Python tests
# The full Python suite, with every dependency it imports. Runs on every PR (no
# path filter, so it always reports) and on pushes to main. Scheduled data jobs
# run only their own tests, so this is where an unrelated break gets caught.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - run: python -m unittest discover -s tests
