name: Validate exact UFC Bruno ten-bout cached recovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/ufc-source-verified-native-id-exceptions.json'
      - 'data/ufc-official-career-bout-inventory.json'
      - 'scripts/ufcalendar-rich-backfill.py'
      - 'tests/test_ufc_full_career_cache.py'
      - '.github/workflows/validate-ufc-bruno-native-history-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict offline UFC source identity and idempotent recovery tests
        run: |
          python3 -m py_compile scripts/ufcalendar-rich-backfill.py
          python3 -m unittest discover -s tests -p 'test_ufc_full_career_cache.py' -v
      - name: Validate existing UFC backfill regressions without paid provider calls
        run: python3 -m unittest discover -s tests -p 'test_ufcalendar_rich_backfill.py' -v
