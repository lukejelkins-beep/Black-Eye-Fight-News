name: Sumo — live iPhone kimarite image rendering audit
on:
  workflow_dispatch:
  push:
    branches: [feat/sumo-section-test-20261114]
    paths:
      - .github/workflows/sumo-kimarite-live-browser-audit.yml
      - assets/sumo-kimarite-gallery.mjs
      - tests/sumo-kimarite-gallery.test.mjs
permissions:
  contents: read
jobs:
  mobile-browser-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser engines
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium webkit
      - name: Check catalogue metadata regression tests
        run: node --test tests/sumo-kimarite-gallery.test.mjs
      - name: Confirm fixed version is live before testing browser
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsSL 'https://befn-sumo-preview.onrender.com/sumo.html' |
              grep -q '20261117-jsa-group-photo-fix-v4'; then
              echo 'The corrected gallery version is live'
              exit 0
            fi
            sleep 5
          done
          echo 'The corrected gallery is not yet deployed' >&2
          exit 1
      - name: Verify public JSA images actually render at mobile viewport sizes
        run: node scripts/sumo-kimarite-live-browser-audit.mjs
      - name: Preserve browser screenshots and response records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumo-kimarite-live-browser-image-qa
          path: qa/sumo-previews/kimarite-live-*
          retention-days: 7
