name: Sumo — live kimarite photo HTTP audit
on:
  workflow_dispatch:
  push:
    branches:
      - feat/sumo-section-test-20261114
    paths:
      - .github/workflows/sumo-kimarite-live-photo-audit.yml
permissions:
  contents: read
jobs:
  check-live-images:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check actual served Sumo preview assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://befn-sumo-preview.onrender.com"
          paths=(
            "/sumo.html"
            "/assets/sumo-kimarite-gallery.mjs?v=20261117-jsa-photo-cachefix-v3"
            "/assets/sumo-kimarite/jsa/kimarite_01.jpg?v=20261117-jsa-photo-cachefix-v3"
            "/assets/sumo-kimarite/jsa/kimarite_03.jpg?v=20261117-jsa-photo-cachefix-v3"
            "/assets/sumo-kimarite/jsa/kimarite_05.jpg?v=20261117-jsa-photo-cachefix-v3"
            "/assets/sumo-kimarite/oshidashi.gif"
          )
          failed=0
          for path in "${paths[@]}"; do
            safe="/tmp/be(fn)-asset.bin"
            http=$(curl -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 \
              -sS -o "$safe" -w '%{http_code}' "$base$path") || http="transport-error"
            bytes=$(wc -c < "$safe" 2>/dev/null || echo 0)
            mime=$(file -b --mime-type "$safe" 2>/dev/null || echo unknown)
            echo "HTTP-AUDIT: $path => status=$http size=$bytes mime=$mime"
            if [[ "$http" != 200 ]]; then failed=1; continue; fi
            case "$path" in
              *.jpg*) if [[ "$mime" != image/jpeg ]] || (( bytes < 4000 )); then failed=1; fi ;;
              *.gif*) if [[ "$mime" != image/gif ]] || (( bytes < 10000 )); then failed=1; fi ;;
              *.html*) if [[ "$mime" != text/html ]] || (( bytes < 500 )); then failed=1; fi ;;
              *.mjs*) if (( bytes < 500 )); then failed=1; fi ;;
            esac
          done
          echo "HTTP-AUDIT SUMMARY failed=$failed"
          exit "$failed"
