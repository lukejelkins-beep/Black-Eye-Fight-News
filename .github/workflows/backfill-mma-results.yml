name: Backfill six-month UFC ONE PFL results
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/backfill-mma-2026.py'
      - 'tests/test_mma_backfill.py'
      - '.github/workflows/backfill-mma-results.yml'
permissions:
  contents: write
concurrency:
  group: mma-history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.14.3
      - name: Validate parser and historical data safeguards
        run: |
          python -m py_compile scripts/backfill-mma-2026.py
          python -m unittest discover -s tests -p 'test_mma_backfill.py' -v
      - name: Ingest and verify archived event data
        run: python scripts/backfill-mma-2026.py
      - name: Publish only verified, changed result cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fight archive updater"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/results.json data/backfill-mma-audit.json
          if git diff --cached --quiet; then
            echo 'No new independently sourced historical results to publish'
            exit 0
          fi
          git commit -m 'Expand verified six-month UFC ONE PFL historical fight cards'
          if git push origin HEAD:main; then
            echo 'Historical results successfully published'
            exit 0
          fi
          echo 'Another updater committed results concurrently; source data retained in this run.'
          echo 'Safely deferring publication to the next run instead of overwriting confirmed data.'
          exit 0
