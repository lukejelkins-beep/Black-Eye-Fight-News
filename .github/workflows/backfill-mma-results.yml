name: Backfill six-month UFC ONE PFL results
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/backfill-mma-2026.py'
      - 'scripts/enrich-ufc-history.py'
      - 'scripts/enrich-promotion-portraits.py'
      - 'scripts/enrich-one-official-portraits.py'
      - 'scripts/reconcile-one-official-october.py'
      - 'data/one-official-october-2026.json'
      - 'tests/test_one_official_october.py'
      - 'tests/test_one_portraits.py'
      - 'scripts/import-official-pfl-2026.py'
      - 'scripts/enrich-pfl-official-portraits.py'
      - 'tests/test_pfl_portraits.py'
      - 'data/pfl-official-results-2026.json'
      - 'tests/test_pfl_official_history.py'
      - 'tests/test_mma_backfill.py'
      - '.github/workflows/backfill-mma-results.yml'
permissions:
  contents: write
concurrency:
  group: mma-history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.14.3
      - name: Validate parser and historical data safeguards
        run: |
          python -m py_compile scripts/backfill-mma-2026.py scripts/enrich-ufc-history.py scripts/enrich-promotion-portraits.py scripts/import-official-pfl-2026.py scripts/enrich-pfl-official-portraits.py scripts/enrich-one-official-portraits.py scripts/reconcile-one-official-october.py
          python -m unittest discover -s tests -p 'test_mma_backfill.py' -v
          python -m unittest discover -s tests -p 'test_pfl_official_history.py' -v
          python -m unittest discover -s tests -p 'test_pfl_portraits.py' -v
          python -m unittest discover -s tests -p 'test_one_portraits.py' -v
          python -m unittest discover -s tests -p 'test_one_official_october.py' -v
      - name: Ingest and verify archived event data
        run: python scripts/backfill-mma-2026.py
      - name: Fill source-matched historic UFC records and portraits
        run: python scripts/enrich-ufc-history.py
      - name: Merge seven fully verified PFL event reports
        run: python scripts/import-official-pfl-2026.py
      - name: Match PFL fighter portraits to official athlete profiles
        run: python scripts/enrich-pfl-official-portraits.py
      - name: Reconcile official ONE 175 and 176 winners disciplines and duplicated matchups
        run: python scripts/reconcile-one-official-october.py
      - name: Resolve identity-verified ONE and PFL fighter images
        run: python scripts/enrich-promotion-portraits.py
      - name: Match further ONE portraits with strict athlete identity and source checks
        run: python scripts/enrich-one-official-portraits.py
      - name: Publish only verified, changed result cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fight archive updater"
          git config user.email "results-bot@users.noreply.github.com"
          # A separate 5-minute live-results workflow can commit while this
          # job researches archived events. On a push conflict, replay only
          # the idempotent source-verified PFL fixture on the newest main.
          for attempt in 1 2 3 4; do
            git add data/results.json data/backfill-mma-audit.json
            if [ -f data/pfl-portrait-progress.json ]; then git add data/pfl-portrait-progress.json; fi
            if [ -f data/one-portrait-progress.json ]; then git add data/one-portrait-progress.json; fi
            if git diff --cached --quiet; then
              echo "All previously verified results already published"
              exit 0
            fi
            git commit -m "Expand verified six-month UFC ONE PFL historical fight cards"
            if git push origin HEAD:main; then
              echo "Verified historical results published to GitHub"
              exit 0
            fi
            echo "::warning::Concurrent results writer updated main; reconciling PFL archive"
            git fetch -q origin main
            git reset --hard -q origin/main
            python scripts/import-official-pfl-2026.py
            python scripts/reconcile-one-official-october.py
            python scripts/enrich-pfl-official-portraits.py
            python scripts/enrich-one-official-portraits.py
          done
          echo "::error::Unable to publish after four concurrency retries; next run will retry safely"
          exit 1
