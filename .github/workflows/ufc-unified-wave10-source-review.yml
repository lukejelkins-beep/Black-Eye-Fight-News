name: UFC wave10 pinned source/native reconciliation (nonproduction)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static script check
        run: node --check scripts/ufc-unified-wave10-source-review.mjs
      - name: One pinned source/native crosscheck (no paid API, no certification writes)
        run: node scripts/ufc-unified-wave10-source-review.mjs
      - name: Preserve source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-wave10-source-only
          path: qa/ufc-unified-wave10-source-review.json
          if-no-files-found: warn
