name: Ensure paid UFC/PFL collector keeps progressing
on:
  schedule:
    # Fallback only: this runs no paid API calls. GitHub's cron is best effort.
    - cron: '9,24,39,54 * * 11 *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: befn-ufc-watchdog
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bounded relay and fail-safe watchdog
        run: node --test tests/test-ufcalendar-relay.mjs
      - name: Restart stalled UFC collection without paid API usage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node scripts/ufcalendar-watchdog.mjs
