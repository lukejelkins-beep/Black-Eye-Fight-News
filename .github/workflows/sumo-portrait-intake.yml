name: Sumo portrait intake (daily)

# Owner approved 2026-11-19: official JSA portraits are fetched automatically for
# wrestlers new to the tracked divisions, and existing portraits are re-checked in
# a rotating batch. Since 2026-11-23 Sumo is built and deployed only through main:
# this job commits to main and the Sumo preview branch is retired. Logic lives in
# scripts/sumo-portrait-intake.py.
#
# Photos are not JSON, and the Render recovery job only auto-accepts JSON under data/
# or qa/ after the last checked commit, so a bot commit of photos would stop every
# deploy until the next merge. After pushing photos this job therefore starts a
# release-readiness run on main; once that passes, the normal deploy goes ahead.
on:
  schedule:
    # 05:53 JST, after the 04:23 JST daily rebuild has onboarded any new wrestlers.
    - cron: '53 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-live-data
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Skip if the intake script is missing
        id: ready
        run: |
          if [ -f scripts/sumo-portrait-intake.py ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "Intake script not found"; fi
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Cache the segmentation model
        if: steps.ready.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use-v1
      - name: Install, test and run the intake
        if: steps.ready.outputs.run == 'true'
        id: run
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "rembg[cpu]==2.0.61" onnxruntime==1.19.2 pillow==11.3.0 numpy==2.0.2
          python -m unittest tests/test_sumo_portrait_intake.py
          python scripts/sumo-portrait-intake.py | tee /tmp/intake.json
          if grep -q '"blocked"' /tmp/intake.json; then echo "::warning::JSA site refused the portrait intake; nothing changed for the remaining wrestlers"; fi
          if grep -q '"review": \[{' /tmp/intake.json; then echo "::warning::Some portraits need a manual identity check; see data/sumo/portrait-intake-status.json"; fi
      - name: Commit only portrait files
        id: commit
        if: steps.ready.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEFN Sumo portrait intake"
          git config user.email "sumo-preview@users.noreply.github.com"
          git add assets/sumo-photos/ data/sumo/approved-photos.json data/sumo/cutouts.json data/sumo/portrait-intake-status.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          # Only a status-file change (rotation cursor) is committed quietly, without a redeploy.
          if git diff --cached --name-only | grep -qv 'portrait-intake-status.json'; then echo "photos=true" >> "$GITHUB_OUTPUT"; fi
          git commit -m "Sumo: official JSA portrait intake"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent change conflict; leaving main unchanged" >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run release readiness on the new commit
        if: steps.commit.outputs.pushed == 'true' && steps.commit.outputs.photos == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run befn-release-readiness.yml --ref main
          echo "Release readiness requested on main; the deploy follows once it passes"
