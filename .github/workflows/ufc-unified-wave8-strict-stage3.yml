name: UFC wave8 full-cohort strict Stage3 gate (nonproduction)
on:
  pull_request:
    branches:
      - research/ufc-unified-stage3-v4-evidence-20261114
    paths:
      - 'data/ufc-independent-full-career-verification.json'
      - 'data/ufc-feeder-bout-evidence.json'
      - 'tests/test-ufc-unified-wave8-evidence.mjs'
      - 'scripts/ufc-unified-jonny-native-alias-review.mjs'
      - '.github/workflows/ufc-unified-wave8-strict-stage3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect unchanged native 2026 Parsons opponent alias
        run: node scripts/ufc-unified-jonny-native-alias-review.mjs
      - name: Verify wave8 full-bout evidence and existing strict invariants
        run: |
          node --test tests/test-ufc-unified-wave8-evidence.mjs
          node --test tests/test-ufc-36-month-stage3-progress.mjs
          node --test tests/test-ufc-v4-certification-queue.mjs
      - name: Independently execute the full 783-person strict career and round audit
        run: |
          node scripts/ufc-36-month-stage3-progress.mjs
          node scripts/ufc-v4-certification-queue.mjs
      - name: Preserve audited result without publishing or deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-wave8-strict-stage3-report
          path: |
            qa/ufc-36-month-stage3-progress.json
            qa/ufc-v4-certification-queue.json
          if-no-files-found: warn
