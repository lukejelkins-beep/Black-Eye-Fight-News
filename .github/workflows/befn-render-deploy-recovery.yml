name: BEFN conditional Render recovery
# Runs independently of the five UFC research automations.
# One-time setup: add RENDER_DEPLOY_HOOK_URL as a GitHub Actions repository secret.
on:
  schedule:
    # Every two hours, UTC; offset from top-of-hour GitHub scheduler congestion.
    - cron: '31 */2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["BEFN release readiness"]
    types: [completed]
    branches: [main]
  # Exercise the controller when its implementation changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/befn-render-deploy-recovery.yml'
permissions:
  contents: read
  actions: write
concurrency:
  group: befn-render-recovery
  cancel-in-progress: false
jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      BASE_URL: https://black-eye-fight-news.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check production asset hashes against source
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          # Only public-facing files: avoid redeploys for research notes,
          # CI scripts, worker worklogs or other non-displayed source changes.
          files=(
            index.html sw.js
            assets/fighter-insights.js assets/fighter-power-index.js
            assets/fighter-power.css assets/ufc-prospect-contender.js
            assets/fighter-profile-v3-layout-preview.css
            assets/performance-highlights-preview.css
            assets/upcoming-cards.js assets/upcoming-cards.css
            assets/results.js assets/results.css assets/fight-talk.css
            assets/fight-film.js assets/news-dedupe.js
            data/results.json data/upcoming-cards.json
            data/fight-talk-live.json data/news-live.json
            data/fight-film.json data/fighter-intelligence.json
            data/ufc-champion-profiles.json data/ufc-contender-profiles.json
            data/ufc-prospect-profiles.json data/ufc-roster-profiles.json
            data/ufc-postfight-metrics.json
          )
          # The V3 file is created by the offline calculator after this source
          # release. Monitor it once present; never fail a pre-build deployment.
          if [[ -f data/ufc-fighter-v3.json ]]; then
            files+=(data/ufc-fighter-v3.json)
          fi
          printf '%s\n' "${files[@]}" > /tmp/befn-watch-files
          differences=0
          : > /tmp/befn-drift-files
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing expected source file: $file" >&2
              exit 1
            fi
            remote=$(mktemp)
            # An undeployed new asset legitimately returns 404. Treat that as
            # source drift, not a transport failure, so recovery can publish it.
            # Any other non-200 response or network failure still fails closed.
            if ! status=$(curl --location --silent --show-error --retry 2 \
                --connect-timeout 8 --max-time 35 -w '%{http_code}' \
                -H 'Cache-Control: no-cache' \
                "$BASE_URL/$file?befn_reconcile=$GITHUB_RUN_ID" -o "$remote"); then
              echo "Cannot determine live asset state for $file; fail closed" >&2
              rm -f "$remote"
              exit 1
            fi
            if [[ "$status" == 404 ]]; then
              echo "New asset not yet deployed: $file"
              echo "$file" >> /tmp/befn-drift-files
              differences=$((differences + 1))
              rm -f "$remote"
              continue
            fi
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP $status for $file; fail closed" >&2
              rm -f "$remote"
              exit 1
            fi
            if ! cmp -s "$file" "$remote"; then
              echo "Not yet live: $file"
              echo "$file" >> /tmp/befn-drift-files
              differences=$((differences + 1))
            fi
            rm -f "$remote"
          done
          echo "differences=$differences" >> "$GITHUB_OUTPUT"
          {
            echo "## BEFN two-hour deployment reconciliation"
            echo "Source checkout: \$GITHUB_SHA"
            echo "Public assets differing on Render: $differences"
            echo "Only source validation and changed public assets can trigger recovery."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate recovery on exact commit CI and avoid an overlapping push
        id: gate
        if: steps.drift.outputs.differences != '0'
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote https://github.com/"$GITHUB_REPOSITORY".git refs/heads/main | cut -f1)
          if [[ "$source_sha" != "$remote_sha" ]]; then
            echo "Newer main commit appeared; next run will assess it"
            exit 0
          fi
          # GitHub Actions commits made with GITHUB_TOKEN do not cause a
          # second push workflow run. The checked release commit may therefore
          # be followed by strictly machine-generated data revisions.
          validated_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/befn-release-readiness.yml/runs?branch=main&status=success&per_page=10" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [[ -z "$validated_sha" ]]; then
            echo 'No successful release-readiness commit; deployment blocked'
            exit 0
          fi
          if [[ "$source_sha" != "$validated_sha" ]]; then
            comparison=$(mktemp)
            if ! gh api "repos/$GITHUB_REPOSITORY/compare/$validated_sha...$source_sha" > "$comparison"; then
              echo 'Cannot establish history from the last checked commit; blocked'
              rm -f "$comparison"; exit 0
            fi
            relationship=$(jq -r '.status // ""' "$comparison")
            file_count=$(jq '.files | length' "$comparison")
            # GitHub's compare endpoint may truncate file lists at 300.
            # An incomplete diff MUST NOT be interpreted as safe.
            if [[ "$relationship" != ahead || "$file_count" -ge 300 ]]; then
              echo 'Unchecked or truncated commit comparison; blocked'
              rm -f "$comparison"; exit 0
            fi
            while IFS= read -r changed; do
              case "$changed" in
                data/ufcalendar-rich-progress.json|data/ufcalendar-card-enhancements.json|\
                data/ufc-research-archive.json|data/pfl-research-archive.json|\
                data/ufcalendar-fighter-research.json|data/ufcalendar-judging-research.json|\
                data/ufc-last-five-coverage.json|data/ufc-profile-research-queue.json|\
                data/ufc-postfight-metrics.json|data/ufc-fighter-v3.json|data/news-live.json|data/results.json|\
                data/upcoming-cards.json|data/fight-film.json|data/fight-talk-live.json|\
                data/fight-talk-embedded.json|data/fight-talk-x-api.json|data/fight-talk-x-budget.json)
                  ;;
                *)
                  echo "Unvalidated non-collector change: $changed; deployment blocked"
                  rm -f "$comparison"; exit 0 ;;
              esac
            done < <(jq -r '.files[].filename' "$comparison")
            rm -f "$comparison"
            echo "Using successful release-readiness $validated_sha plus verified collector-only changes"
          fi
          echo "GitHub source validated: $validated_sha" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo 'One-time configuration required: GitHub Actions secret RENDER_DEPLOY_HOOK_URL'
            echo 'Deployment not attempted: missing RENDER_DEPLOY_HOOK_URL secret.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A short second observation avoids racing a normal Render auto-deploy.
          # We deliberately do NOT require the newest data commit to be ten
          # minutes old: regular five-minute result refreshes would starve
          # deployment forever. The two-hour schedule is the primary debounce.
          echo 'Allowing normal Render automatic deployment time to converge'
          sleep 90
          new_main=$(git ls-remote https://github.com/"$GITHUB_REPOSITORY".git refs/heads/main | cut -f1)
          if [[ "$new_main" != "$source_sha" ]]; then
            # An ongoing archive collector can update *only cached data* while
            # the grace check sleeps. Establish and verify that narrow case
            # instead of starving every UI fix or re-deploying old source.
            transition=$(mktemp)
            if ! gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$new_main" > "$transition"; then
              echo 'Cannot verify source advance during grace; blocked'
              rm -f "$transition"; exit 0
            fi
            transition_status=$(jq -r '.status // ""' "$transition")
            transition_count=$(jq -r '.files | length' "$transition")
            if [[ "$transition_status" != ahead || "$transition_count" -ge 300 ]]; then
              echo 'Non-linear or truncated source advance during grace; blocked'
              rm -f "$transition"; exit 0
            fi
            while IFS= read -r changed; do
              case "$changed" in
                data/ufcalendar-rich-progress.json|data/ufcalendar-card-enhancements.json|\
                data/ufc-research-archive.json|data/pfl-research-archive.json|\
                data/ufcalendar-fighter-research.json|data/ufcalendar-judging-research.json|\
                data/ufc-last-five-coverage.json|data/ufc-profile-research-queue.json|\
                data/ufc-postfight-metrics.json|data/ufc-fighter-v3.json|data/news-live.json|data/results.json|\
                data/upcoming-cards.json|data/fight-film.json|data/fight-talk-live.json|\
                data/fight-talk-embedded.json|data/fight-talk-x-api.json|data/fight-talk-x-budget.json)
                  ;;
                *)
                  echo "Code or unvalidated data changed during grace: $changed; blocked"
                  rm -f "$transition"; exit 0 ;;
              esac
            done < <(jq -r '.files[].filename' "$transition")
            rm -f "$transition"
            git fetch --quiet --no-tags origin main
            if [[ "$(git rev-parse FETCH_HEAD)" != "$new_main" ]]; then
              echo 'Main advanced again while verifying: abort this recovery'
              exit 0
            fi
            git reset --hard "$new_main"
            source_sha="$new_main"
            echo "Using validated source plus verified data-only advance $source_sha"
          fi
          still_different=0
          while IFS= read -r file; do
            remote=$(mktemp)
            if ! status=$(curl --location --silent --show-error --max-time 35 \
              -w '%{http_code}' "$BASE_URL/$file?befn_predeploy_recheck=$GITHUB_RUN_ID" -o "$remote"); then
              echo 'Production transport unavailable; aborting rather than adding a deploy' >&2
              rm -f "$remote"
              exit 1
            fi
            if [[ "$status" == 404 ]]; then
              # A new public file still missing after the grace period IS
              # continued drift, not a site outage. Recovery may proceed.
              still_different=$((still_different + 1))
              rm -f "$remote"
              continue
            fi
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP $status on recheck; fail closed" >&2
              rm -f "$remote"
              exit 1
            fi
            if ! cmp -s "$file" "$remote"; then
              still_different=$((still_different + 1))
            fi
            rm -f "$remote"
          done < /tmp/befn-drift-files
          if [[ "$still_different" -eq 0 ]]; then
            echo 'Normal Render auto-deploy caught up; no recovery needed'
            exit 0
          fi
          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Trigger exactly one fallback deployment
        id: deploy
        if: steps.gate.outputs.approved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.gate.outputs.sha }}"
          latest=$(git ls-remote https://github.com/"$GITHUB_REPOSITORY".git refs/heads/main | cut -f1)
          if [[ "$latest" != "$expected" ]]; then
            echo 'Main changed since source validation; aborting recovery'
            exit 0
          fi
          # The secret is NEVER written to logs or saved in the repository.
          curl --fail --silent --show-error --max-time 35 \
            --request POST "$RENDER_DEPLOY_HOOK_URL" --output /dev/null
          echo 'triggered=true' >> "$GITHUB_OUTPUT"
          echo "Recovery deploy requested for $expected" >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm public assets converge and initiate separate live QA
        if: steps.deploy.outputs.triggered == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.gate.outputs.sha }}"
          # A deploy-hook HTTP response is only acceptance, NOT a live release.
          success=false
          for attempt in {1..12}; do
            differences=0
            while IFS= read -r file; do
              remote=$(mktemp)
              if ! curl --fail --location --silent --show-error \
                --connect-timeout 8 --max-time 30 \
                "$BASE_URL/$file?befn_release_qa=$GITHUB_RUN_ID-$attempt" -o "$remote" \
                || ! cmp -s "$file" "$remote"; then
                differences=$((differences + 1))
              fi
              rm -f "$remote"
            done < /tmp/befn-watch-files
            if [[ "$differences" -eq 0 ]]; then success=true; break; fi
            echo "Render still catching up: $differences assets (attempt $attempt)"
            sleep 25
          done
          if [[ "$success" != true ]]; then
            echo 'Render did not converge to verified assets in the check window' >&2
            exit 1
          fi
          echo 'Render hostname now matches checked public assets' >> "$GITHUB_STEP_SUMMARY"
          latest=$(git ls-remote https://github.com/"$GITHUB_REPOSITORY".git refs/heads/main | cut -f1)
          if [[ "$latest" == "$expected" ]]; then
            # Custom-domain CDN can lag Render; avoid triggering browser QA
            # until the main public assets have reached visitors too.
            custom_ready=false
            for attempt in {1..6}; do
              stale=0
              for file in index.html assets/fighter-insights.js assets/fighter-power.css data/ufc-prospect-profiles.json; do
                body=$(mktemp)
                if ! curl --fail --location --silent --show-error --max-time 35 \
                  "https://blackeyefightnews.com.au/$file?befn_custom_qa=$GITHUB_RUN_ID-$attempt" -o "$body" \
                  || ! cmp -s "$file" "$body"; then
                  stale=$((stale + 1))
                fi
                rm -f "$body"
              done
              if [[ "$stale" -eq 0 ]]; then custom_ready=true; break; fi
              sleep 25
            done
            if [[ "$custom_ready" == true ]]; then
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/verify-live-ufc-profiles.yml/dispatches" \
                -f ref=main > /dev/null
              echo 'Started independent post-deploy UFC desktop/mobile QA. Pending result.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Custom-domain CDN still converging; hourly production QA will recheck.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'Newer HEAD arrived; hourly live QA will evaluate the next release' >> "$GITHUB_STEP_SUMMARY"
          fi
