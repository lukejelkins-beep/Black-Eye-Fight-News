name: Build UFCalendar 18 month UFC research archive
on:
  workflow_dispatch:
  schedule:
    - cron: '21 1,7,13,19 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-ufcalendar-pro.py'
      - 'tests/test_ufcalendar_pro.py'
      - '.github/workflows/refresh-ufcalendar-pro.yml'
permissions:
  contents: write
concurrency:
  group: befn-ufcalendar-hobby-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test identity, quota and incremental import without API usage
        run: python -m unittest discover -s tests -p 'test_ufcalendar_pro.py' -v
      - name: Capture historical per-round evidence and current cards
        env:
          UFCALENDAR_API_KEY: ${{ secrets.UFCALENDAR_API_KEY }}
        run: python scripts/refresh-ufcalendar-pro.py
      - name: Persist curated sourced evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BEFN UFCalendar collector'
          git config user.email 'ufcalendar-collector@users.noreply.github.com'
          git add data/ufcalendar-pro-ledger.json data/ufcalendar-pro-cards.json data/ufcalendar-pro-rounds.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh sourced UFCalendar UFC archive and event cards'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
