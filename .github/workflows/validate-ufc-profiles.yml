name: Validate UFC fighter profile cards
on:
  workflow_dispatch:
  push:
    branches:
      - feature/responsive-sports-layout
      - main
    paths:
      - 'data/ufc-*-profiles.json'
      - 'scripts/build-ufc-profile-queue.mjs'
      - 'scripts/build-ufc-postfight-metrics.mjs'
      - 'tests/test-ufc-postfight-metrics.mjs'
      - 'data/ufc-postfight-metrics.json'
      - 'tests/test-ufc-profile-queue.mjs'
      - 'tests/test-ufc-profile-visual.mjs'
      - 'tests/test-ufc-async-authority.cjs'
      - 'scripts/ufc-qa-freshness.mjs'
      - 'tests/test-ufc-qa-freshness.mjs'
      - 'data/ufc-postfight-metrics.json'
      - 'assets/fighter-insights.js'
      - 'assets/fighter-hover.js'
      - 'tests/test-fighter-photo-close.cjs'
      - 'assets/ufc-prospect-contender.js'
      - 'tests/test-ufc-prospect-contender.cjs'
      - 'assets/fighter-power.css'
      - 'index.html'
      - 'sw.js'
      - 'assets/fighter-power-index.js'
      - 'tests/test-ufc-*.cjs'
      - 'tests/test-fighter-power-index.cjs'
      - 'tests/test-ufc-postfight-metrics.mjs'
      - '.github/workflows/validate-ufc-profiles.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/test-ufc-title-match.cjs'
      - 'data/ufc-*-profiles.json'
      - 'assets/fighter-insights.js'
      - 'scripts/build-ufc-fighter-v3.mjs'
      - 'tests/test-ufc-fighter-v3.mjs'
      - 'tests/test-ufc-profile-visual.mjs'
      - '.github/workflows/validate-ufc-profiles.yml'
      - 'tests/test-ufc-async-authority.cjs'
      - 'assets/fighter-power-index.js'
      - 'tests/test-ufc-*.cjs'
      - 'tests/test-fighter-power-index.cjs'
permissions:
  contents: read
jobs:
  profile-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate UFC model and browser script syntax
        run: |
          node --check assets/fighter-power-index.js
          node --check assets/fighter-insights.js
          node --check assets/ufc-prospect-contender.js
          node tests/test-fighter-photo-close.cjs
      - name: Validate all UFC profile cards and source data
        run: node tests/test-ufc-profile-card-qa.cjs
      - name: Verify champion cohort and evidence gates
        run: |
          node tests/test-ufc-title-match.cjs
          node tests/test-ufc-champion-profiles.cjs
          node tests/test-fighter-power-index.cjs
          node tests/test-ufc-prospect-contender.cjs
      - name: Verify reviewed UFC facts survive reversed async response orders
        run: node --test tests/test-ufc-async-authority.cjs
      - name: Regression-test deployed frontend freshness detection
        run: node --test tests/test-ufc-qa-freshness.mjs
      - name: Verify historical queue and five-fight source audit contract
        run: |
          node --test tests/test-ufc-profile-queue.mjs
          node --test tests/test-ufc-research-pipeline.mjs
      - name: Verify post-fight event reconciliation and no double counting
        run: node --test tests/test-ufc-postfight-metrics.mjs
      - name: Reconcile the five-fight coverage before V3 and browser checks
        run: |
          node --test tests/test-ufc-last-five-coverage.mjs
          node scripts/build-ufc-last-five-coverage.mjs
          node --test tests/test-ufc-fighter-v3.mjs
          node scripts/build-ufc-fighter-v3.mjs
      - name: Install browser test dependency (CI only)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect every UFC profile card on desktop and mobile
        run: node tests/test-ufc-profile-visual.mjs
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-profile-qa
          path: qa/ufc-profile-screenshots/
          retention-days: 7
          if-no-files-found: warn
      - name: Publication notice
        run: echo 'Validation only; publish gate must pass before reviewed cohort is committed.'
