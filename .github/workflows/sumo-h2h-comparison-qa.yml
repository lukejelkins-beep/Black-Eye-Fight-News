name: Sumo H2H comparison QA
on:
  push:
    branches:
      - feat/sumo-h2h-comparison-kimarite-20261116
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/sumo.js
      - run: node --test tests/test-sumo-h2h-pies.mjs tests/test-sumo-data.mjs
