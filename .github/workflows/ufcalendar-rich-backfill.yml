name: Paid UFCalendar UFC/PFL historic research and fight card improvements
on:
  workflow_dispatch:
    inputs:
      continuous:
        description: 'Internal bounded five-minute relay (manual runs default to one-time)'
        required: false
        type: boolean
        default: false
      hop:
        description: 'Internal relay hop number (0-71)'
        required: false
        type: string
        default: '0'
  schedule:
    # Outside the November burst, retain four daily maintenance windows.
    # November runs use GitHub's explicit workflow_dispatch relay and
    # the separate watchdog: cron every five minutes was routinely dropped.
    - cron: '20 0,6,12,18 * 1-10,12 *'
  push:
    branches: [main]
    paths:
      - 'scripts/ufcalendar-rich-backfill.py'
      - 'scripts/ufcalendar-relay.mjs'
      - 'scripts/build-ufc-36-month-candidates.mjs'
      - 'scripts/build-ufc-last-five-coverage.mjs'
      - 'tests/test-ufc-36-month-candidates.mjs'
      - 'tests/test_ufc_full_career_cache.py'
      - 'tests/test-ufcalendar-relay.mjs'
      - 'tests/test_ufcalendar_rich_backfill.py'
      - '.github/workflows/ufcalendar-rich-backfill.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: befn-ufc-research-archive
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Record job start for the five-minute interval
        run: echo "BEFN_RELAY_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate monthly quota, safe record merges and feed formatting
        run: |
          node --test tests/test-ufcalendar-relay.mjs
          python -m unittest discover -s tests -p 'test_ufcalendar_rich_backfill.py' -v
          python -m unittest discover -s tests -p 'test_ufc_full_career_cache.py' -v
          python -m unittest discover -s tests -p 'test_ufc_research_archive.py' -v
          node --test tests/test-ufc-profile-queue.mjs
          node --test tests/test-ufc-36-month-candidates.mjs
          node --test tests/test-ufc-postfight-metrics.mjs
          node --test tests/test-ufc-independent-certification-queue.mjs
          node --test tests/test-reconcile-ufc-independent-evidence.mjs
      - name: Build resumable UFC/PFL fight history and current card insights
        env:
          UFCALENDAR_API_KEY: ${{ secrets.UFCALENDAR_API_KEY }}
          BEFN_UFCAL_MAX_CALLS: '500'
        run: python scripts/ufcalendar-rich-backfill.py
      - name: Derive reviewed UFC profile needs and post-fight metrics from collected data
        run: |
          node scripts/build-ufc-profile-queue.mjs
          node scripts/build-ufc-postfight-metrics.mjs
          node scripts/build-ufc-36-month-candidates.mjs
      - name: Report verified approved Stage 3 coverage from saved data (no API calls)
        if: success()
        shell: bash
        run: |
          # This is an offline snapshot of the *same* cached data just collected.
          # Do not jeopardize saving new research if an audit precondition fails.
          if node scripts/ufc-36-month-stage3-progress.mjs; then
            echo "Approved UFC Stage 3 coverage audited; see BEFN_STAGE3_PROGRESS above."
          else
            echo "::warning::Offline Stage 3 audit unavailable; preserve newly fetched records and continue."
          fi
      - name: Build independent UFC career certification evidence queue (offline, bounded)
        if: success()
        shell: bash
        run: |
          # Source crawling is intentionally disabled pending verified access.
          # Never block safe archival commits when offline triage is unavailable.
          if node scripts/build-ufc-independent-certification-queue.mjs; then
            echo "Independent certification queue generated; source requests: 0."
          else
            echo "::warning::Independent certification queue unavailable; collector archive remains authoritative."
          fi
      - name: Reconcile already obtained authorized UFCStats source exports (offline only)
        if: success()
        shell: bash
        run: |
          # Optional evidence input. No HTTP, paid API requests, or certification writes.
          if node scripts/reconcile-ufc-independent-evidence.mjs; then
            echo "Independent source crosswalk audited; no network requests."
          else
            echo "::warning::Independent source crosswalk unavailable; archived provider data preserved."
          fi
      - name: Commit sourced observations without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BEFN UFCalendar archive'
          git config user.email 'ufcalendar-archive-bot@users.noreply.github.com'
          git add data/ufcalendar-rich-progress.json data/ufcalendar-card-enhancements.json data/ufcalendar-fighter-research.json data/ufcalendar-judging-research.json data/ufc-research-archive.json data/pfl-research-archive.json data/ufc-profile-research-queue.json data/ufc-postfight-metrics.json data/ufc-36-month-candidates.json
          if git diff --cached --quiet; then echo 'No research updates'; exit 0; fi
          git commit -m 'Refresh expanded UFCalendar fight history, scouting and schedule intelligence'
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'UFCalendar research saved'; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
      - name: Safely request next bounded five-minute run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ufcalendar-relay.mjs
