name: UFC wave8 pinned history/native source reconciliation (nonproduction)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source review syntax (no paid API)
        run: node --check scripts/ufc-unified-wave8-source-review.mjs
      - name: Reconcile seven independent UFC.com careers against pinned Greco and cached native fights
        run: node scripts/ufc-unified-wave8-source-review.mjs
      - name: Save crosscheck report for human/strict-gate review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-wave8-source-crosscheck
          path: qa/ufc-unified-wave8-source-review.json
          if-no-files-found: warn
