name: Sumo directory fullbleed QA
on:
  push:
    branches: [feat/sumo-directory-fullbleed-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/sumo.js
      - run: node --test tests/test-sumo-data.mjs tests/test-sumo-rank-labels.mjs tests/test-sumo-photo-credits.mjs
