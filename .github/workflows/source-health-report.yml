name: Source health report

# Owner report. Read-only: reads the saved data files, makes no network calls,
# uses no secrets and commits nothing. The report appears on the run's summary page.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Optional: feed URLs to test (space separated)'
        required: false
        default: ''
  schedule:
    - cron: '41 21 * * 0'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the report
        run: python3 scripts/source-health.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Test feed URLs (only when asked)
        if: ${{ github.event.inputs.probe != '' }}
        env:
          PROBE_URLS: ${{ github.event.inputs.probe }}
        run: |
          # shellcheck disable=SC2086
          python3 scripts/probe-feeds.py $PROBE_URLS | tee -a "$GITHUB_STEP_SUMMARY"
