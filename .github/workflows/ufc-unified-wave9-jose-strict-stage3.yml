name: UFC wave9 Jose Henrique full 783-person strict Stage3 gate (nonproduction)
on:
  pull_request:
    branches:
      - research/ufc-wave8-crosscheck-20261114
    paths:
      - 'data/ufc-independent-full-career-verification.json'
      - 'data/ufc-feeder-bout-evidence.json'
      - 'tests/test-ufc-unified-wave9-jose-evidence.mjs'
      - '.github/workflows/ufc-unified-wave9-jose-strict-stage3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Jose official two-bout career and original unchanged native source identity
        run: |
          node --test tests/test-ufc-unified-wave9-jose-evidence.mjs
          node --test tests/test-ufc-unified-wave8-evidence.mjs
          node --test tests/test-ufc-36-month-stage3-progress.mjs
          node --test tests/test-ufc-v4-certification-queue.mjs
      - name: Attempt all 783 complete UFC career certifications with strict independent gate
        run: |
          node scripts/ufc-36-month-stage3-progress.mjs
          node scripts/ufc-v4-certification-queue.mjs
      - name: Preserve all-batch read-only result without deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-ufc-wave9-jose-full-cohort-strict-stage3
          path: |
            qa/ufc-36-month-stage3-progress.json
            qa/ufc-v4-certification-queue.json
          if-no-files-found: warn
