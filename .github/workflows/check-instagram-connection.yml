name: Verify Instagram API connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check-instagram-connection.mjs'
      - '.github/workflows/check-instagram-connection.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check credential-safe verifier
        run: node --check scripts/check-instagram-connection.mjs
      - name: Probe Meta endpoints using secret headers only
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: node scripts/check-instagram-connection.mjs
