name: Check the published site build
on:
  workflow_dispatch:
  # No path filter: any change can add or drop a data reference (a page, a
  # script, a feed), so every PR builds dist/ exactly as Render does.
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dist/ exactly as Render does and check what is published
        run: |
          node --test tests/test-build-site.mjs tests/test-bonuses-section.mjs
          node scripts/build-site.mjs
