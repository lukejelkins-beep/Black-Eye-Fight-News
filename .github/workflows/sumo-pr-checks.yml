name: Sumo preview PR checks

# Runs on pull requests into the Sumo preview branch. Read-only: runs the Sumo
# tests and a dry run of the daily refresh against the Sumo API, commits nothing.
on:
  pull_request:
    branches: [feat/sumo-section-test-20261114]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sumo tests
        shell: bash
        run: |
          set -uo pipefail
          # Pre-existing UI-test failures (present before 2026-11-19, tracked
          # separately). Any OTHER failing Sumo test now fails this step; a
          # listed file that starts passing is reported so it can be removed.
          known=" tests/test-sumo-editorial.mjs tests/test-sumo-profile-refinements.mjs tests/test-sumo-roster-ux.mjs tests/test-sumo-ux-refinement.mjs "
          fail=0
          for f in tests/test-sumo-*.mjs; do
            if node --test "$f" > /tmp/out.txt 2>&1; then
              echo "PASS $f"
              case "$known" in *" $f "*) echo "::notice::$f now passes; remove it from the known-failure list.";; esac
            else
              grep -E -A12 '^not ok|^ *not ok' /tmp/out.txt | grep -E 'not ok|error|expected|actual|message' | head -20
              case "$known" in
                *" $f "*) echo "KNOWN-FAIL $f (pre-existing)";;
                *) echo "::error::FAIL $f"; fail=1;;
              esac
            fi
          done
          exit "$fail"
      - name: Dry run of the daily refresh (no commit)
        run: |
          node scripts/sumo-refresh-daily.mjs
          node -e "const d=require('./data/sumo/preview-details.json');console.log(JSON.stringify({announcedDay:d.announcedDay,dailyStatus:d.dailyStatus,dailySource:d.dailySource,count:d.dailyScheduleCount,divisions:Object.fromEntries(Object.entries(d.torikumi||{}).map(([k,v])=>[k,v.status+':'+(v.data?.torikumi?.length||0)]))}))"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Portrait intake tests and a 4-profile dry run from this runner (no commit)
        run: |
          python -m pip install --quiet pillow==11.3.0
          python -m unittest tests/test_sumo_portrait_intake.py
          python scripts/sumo-portrait-intake.py --dry-run --update-batch 4

  portrait-intake-end-to-end:
    # The real new-photo path on a GitHub runner: forget two wrestlers' portraits in
    # this throwaway checkout, run the intake, and require it to bring both back
    # byte-identical with the right cut-out/headshot handling. Commits nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache the segmentation model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use-v1
      - name: Forget Takayasu (full-body) and Mineyaiba (headshot), then run the intake
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "rembg[cpu]==2.0.61" onnxruntime==1.19.2 pillow==11.3.0 numpy==2.0.2
          python - <<'PY'
          import json, os
          p = 'data/sumo/approved-photos.json'; d = json.load(open(p))
          c = 'data/sumo/cutouts.json'; m = json.load(open(c))
          for sid in ('44', '75'):
              d['bySourceId'].pop(sid)
              os.remove(f'assets/sumo-photos/jsa-{sid}.jpg')
          m['bySourceId'].pop('44'); os.remove('assets/sumo-photos/cutout/jsa-44.webp')
          m['headshotOrPartial'].remove('75')
          json.dump(d, open(p, 'w'), indent=2, ensure_ascii=False)
          json.dump(m, open(c, 'w'), indent=2, ensure_ascii=False)
          PY
          python scripts/sumo-portrait-intake.py --update-batch 0 | tee /tmp/intake.json
          python - <<'PY'
          import json
          r = json.load(open('/tmp/intake.json'))
          assert sorted(r['added']) == ['44', '75'], r
          assert not r['review'] and not r['errors'] and 'blocked' not in r, r
          m = json.load(open('data/sumo/cutouts.json'))
          assert '44' in m['bySourceId'], 'full-body portrait did not get a cut-out'
          assert '75' in m['headshotOrPartial'], 'headshot was not recorded as a headshot'
          PY
          git diff --exit-code -- assets/sumo-photos/jsa-44.jpg assets/sumo-photos/jsa-75.jpg
          git show HEAD:assets/sumo-photos/cutout/jsa-44.webp > /tmp/committed-44.webp
          python - <<'PY'
          import numpy as np
          from PIL import Image
          a = np.array(Image.open('/tmp/committed-44.webp').getchannel('A')) > 128
          b = np.array(Image.open('assets/sumo-photos/cutout/jsa-44.webp').getchannel('A')) > 128
          assert a.shape == b.shape or abs(a.shape[0] - b.shape[0]) <= 3, (a.shape, b.shape)
          h, w = min(a.shape[0], b.shape[0]), min(a.shape[1], b.shape[1])
          a, b = a[:h, :w], b[:h, :w]
          iou = (a & b).sum() / (a | b).sum()
          print('cut-out outline match', round(float(iou), 4))
          assert iou >= 0.98, iou
          PY
          echo "New-photo path verified: photos byte-identical, cut-out matches"
