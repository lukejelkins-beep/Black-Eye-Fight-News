name: Discover fighter X Instagram and Threads profiles
on:
  # Secondary diagnostic only; primary automated discovery runs in discover-fighter-profiles.yml.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/discover-fight-talk-profiles.mjs'
      - 'tests/test-fight-talk-profiles.mjs'
      - '.github/workflows/discover-fight-talk-profiles.yml'
permissions:
  contents: write
concurrency:
  group: discover-fighter-profiles
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify discovery logic and existing source roster
        run: |
          node --check scripts/discover-fight-talk-profiles.mjs
          node tests/test-fight-talk-profiles.mjs
          node tests/test-fight-talk-roster.cjs
      - name: Discover official-directory social identifiers without credentials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset --hard -q origin/main
            node scripts/discover-fight-talk-profiles.mjs || echo 'Wikidata currently unavailable; retaining existing identities'
            node tests/test-fight-talk-profiles.mjs
            node tests/test-fight-talk-roster.cjs
            git add data/fight-talk-profile-discovery.json data/fight-talk-sources.json data/fight-talk-roster.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Discover fighter X Instagram and Threads profiles'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
