name: Refresh news feeds
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-news.py'
      - 'tests/test_news.py'
      - 'tests/test-desk.cjs'
      - 'assets/local-time.js'
      - 'assets/live-desk.inc.js'
      - '.github/workflows/refresh-news.yml'
permissions:
  contents: write
concurrency:
  group: publish-live-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-desk.cjs
      - name: Refresh and publish against latest data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/refresh-news.py
            git add data/news-live.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh boxing and MMA headlines with thumbnails'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
