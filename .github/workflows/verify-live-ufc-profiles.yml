name: Verify live UFC fighter profiles
# Live QA must NOT be a check on a new source commit before Render deploys it.
# That causes false failures and deadlocks Render's "After CI Checks Pass" mode.
# Run periodically or manually after a successful deployment.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: befn-production-ufc-profile-qa
  cancel-in-progress: false
jobs:
  operational-report:
    # Advisory read-only reporting shares the existing hourly monitor schedule.
    # It never deploys, collects fighter data or changes certification status.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Report bounded main workflow history and cached data health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/qa-supervisor.py --github
      - name: Publish operational summary
        if: always()
        run: |
          if test -f qa/supervisor/qa-status.md; then
            cat qa/supervisor/qa-status.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: befn-qa-operational-status
          path: qa/supervisor/
          retention-days: 14
          if-no-files-found: warn
  production-profiles:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm source JSON is valid and algorithmic labels are consistent
        run: |
          node tests/test-ufc-profile-card-qa.cjs
          node tests/test-ufc-prospect-contender.cjs
          node --check tests/test-ufc-profile-visual.mjs
      - name: Verify reviewed UFC facts survive reversed async response orders
        run: node --test tests/test-ufc-async-authority.cjs
      - name: Regression-test old HTML/JS with new profile JSON
        run: node --test tests/test-ufc-qa-freshness.mjs
      - name: Check Render deployment freshness before browser installation
        env:
          BEFN_PROFILE_QA_BASE: https://blackeyefightnews.com.au
        run: node scripts/verify-ufc-live-freshness.mjs
      - name: Install browser test dependency (CI only)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the actual production domain and every reviewed fighter
        env:
          BEFN_PROFILE_QA_BASE: https://blackeyefightnews.com.au
        run: node tests/test-ufc-profile-visual.mjs
      - name: Upload per-fighter desktop/mobile screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befn-live-ufc-profile-qa
          path: qa/ufc-profile-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Report production QA separately from editorial fact checks
        if: always()
        run: |
          echo 'A passing production run proves the deployed dataset and UI match independently reviewed repository records at check time, not independent truth of all source claims or visual-perfect human signoff.'
