name: Sumo API source connection QA
on:
  push:
    branches:
      - feat/sumo-api-source-20261114
    paths:
      - scripts/sumo-api-source.mjs
      - tests/test-sumo-api-source.mjs
      - docs/sumo-api-integration.md
      - .github/workflows/sumo-api-source-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sumo-api-source-read-only
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Sumo source mapping, safety and pagination
        run: node --test tests/test-sumo-api-source.mjs
      - name: Verify real Sumo API with two small read-only requests
        run: node scripts/sumo-api-source.mjs --smoke
