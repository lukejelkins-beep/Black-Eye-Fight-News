name: Boxerbook source QA
on:
  workflow_dispatch:
    inputs:
      live_check:
        description: 'Read-only live API QA (two calls; no deployment)'
        type: boolean
        default: false
  push:
    branches: [main, 'feature/boxerbook-boxing-source']
    paths:
      - 'scripts/boxerbook_source.py'
      - 'tests/test_boxerbook_source.py'
      - '.github/workflows/boxerbook-source-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact identity matching and no source data overwrites
        run: python -m unittest discover -s tests -p 'test_boxerbook_source.py' -v
      - name: Check live Boxerbook schedule and results (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.live_check == true
        env:
          BOXERBOOK_API_KEY: ${{ secrets.BOXERBOOK_API_KEY || secrets.BOXERBOOK_KEY || secrets.BOXERBOOK_KEU }}
        run: python scripts/boxerbook_source.py --live --report qa/boxerbook-source-review.json
      - name: Describe the results layout (field names only, no values)
        if: github.event_name == 'workflow_dispatch' && inputs.live_check == true
        env:
          BOXERBOOK_API_KEY: ${{ secrets.BOXERBOOK_API_KEY || secrets.BOXERBOOK_KEY || secrets.BOXERBOOK_KEU }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from boxerbook_source import fetch_json
          key = os.getenv('BOXERBOOK_API_KEY', '')
          print('key found:', 'yes' if key else 'no')
          def shape(v, pad=''):
              if isinstance(v, dict):
                  for k, x in v.items():
                      print(pad + k + ': ' + type(x).__name__)
                      if isinstance(x, (dict, list)) and len(pad) < 8:
                          shape(x, pad + '  ')
              elif isinstance(v, list) and v:
                  print(pad + '[0] of ' + str(len(v)))
                  shape(v[0], pad + '  ')
          r = fetch_json('/results', {'days': 14}, key=key); bs = r['bouts']; print('count', len(bs), 'truncated', r['truncated'], r['from'], r['to']); import collections as C; [print(f, C.Counter(str(b.get(f)) for b in bs).most_common(12)) for f in ('winner','confirmation','method','round','time','division')]; print('records', [b['a'].get('record') for b in bs if b['a'].get('record')][:3]); print('display', bs[0]['display'] if bs else None)
          PY
      - name: Upload one-day QA report for review
        if: github.event_name == 'workflow_dispatch' && inputs.live_check == true
        uses: actions/upload-artifact@v4
        with:
          name: boxerbook-source-qa
          path: qa/boxerbook-source-review.json
          retention-days: 1
