name: Build UFC profile research queue
on:
  workflow_dispatch:
  schedule:
    # GitHub scheduling is best-effort; runs may be delayed or dropped.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build-ufc-profile-queue.mjs'
      - 'tests/test-ufc-profile-queue.mjs'
      - '.github/workflows/build-ufc-profile-queue.yml'
permissions:
  contents: write
concurrency:
  group: befn-ufc-profile-research-queue
  cancel-in-progress: false
jobs:
  compile-research-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test UFC candidate isolation and deterministic ordering
        run: |
          node --test tests/test-ufc-profile-queue.mjs
          node tests/test-ufc-profile-card-qa.cjs
      - name: Refresh queue from existing budgeted UFCalendar data
        run: node scripts/build-ufc-profile-queue.mjs
      - name: Save material candidate changes without rewriting live feeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BEFN research queue'
          git config user.email 'research-queue-bot@users.noreply.github.com'
          git add data/ufc-profile-research-queue.json
          if git diff --cached --quiet; then
            echo 'No new research candidates; no commit'; exit 0
          fi
          git commit -m 'Refresh UFC fighter research candidates from existing archives'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Saved research queue'; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          echo 'Concurrent data updates prevented queue commit; next run will retry' >&2
          exit 1
