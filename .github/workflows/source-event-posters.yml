name: Find missing portrait fight posters

on:
  # Exactly every other Melbourne calendar day, even across month boundaries.
  # A daily UTC cron is gated against the Melbourne date below.
  schedule:
    - cron: '19 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/source-event-posters.py'
      - 'tests/test_poster_discovery.py'
      - '.github/workflows/source-event-posters.yml'

permissions:
  contents: write

concurrency:
  group: missing-event-portrait-posters
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute every-other-day Melbourne cadence
        id: cadence
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          melbourne_date = datetime.now(ZoneInfo("Australia/Melbourne")).date()
          due = (melbourne_date - date(2026,11,10)).days % 2 == 0
          print("due=" + str(due).lower())
          print("melbourne_date=" + melbourne_date.isoformat())
          PY
      - name: Install image validation and HTML parsing tools
        if: github.event_name != 'schedule' || steps.cadence.outputs.due == 'true'
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Verify poster suitability and do-not-replace policy
        if: github.event_name != 'schedule' || steps.cadence.outputs.due == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_poster_discovery.py' -v
          node --check assets/upcoming-cards.js
          node tests/test-upcoming-poster-fit.cjs
      - name: Check multiple sources and publish only new validated posters
        if: github.event_name != 'schedule' || steps.cadence.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "missing-poster-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset --hard -q origin/main
            python scripts/source-event-posters.py
            git add data/upcoming-cards.json
            if git diff --cached --quiet; then
              echo "No new sufficiently verified portrait/square posters found. Existing thumbnails preserved."
              break
            fi
            git commit -m "Add verified portrait/square posters to upcoming fight cards"
            if git push origin HEAD:main; then
              echo "New verified posters published; existing Render GitHub auto-deploy can deploy this commit."
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
      - name: Upload poster research audit
        if: always() && (github.event_name != 'schedule' || steps.cadence.outputs.due == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: missing-fight-poster-check
          path: qa/missing-poster-discovery.json
          retention-days: 30
          if-no-files-found: ignore
