name: Meta Threads insights permission test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-insights:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate test script
        run: node --check scripts/check-threads-insights.mjs
      - name: Test authorised Threads profile and post insights
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/check-threads-insights.mjs
