name: Find and add verified Bluesky accounts
on:
  schedule:
    # Weekly. Adds verified accounts (max 25 per run); name-only matches are never collected.
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/find-bluesky-accounts.mjs'
      - 'tests/test-bluesky-candidates.mjs'
      - '.github/workflows/find-bluesky-accounts.yml'
permissions:
  contents: write
concurrency:
  group: find-bluesky-accounts
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check matching rules
        run: |
          node --check scripts/find-bluesky-accounts.mjs
          node tests/test-bluesky-candidates.mjs
      - name: Search Bluesky, add verified accounts and save the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset --hard -q origin/main
            node scripts/find-bluesky-accounts.mjs
            node tests/test-fight-talk-roster.cjs
            node tests/test-fight-talk-rotation.mjs
            git add data/bluesky-candidates.json data/fight-talk-sources.json
            if git diff --cached --quiet; then
              echo 'Candidate list unchanged'
              exit 0
            fi
            git commit -m 'Add verified Bluesky accounts for Fight Talk'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
