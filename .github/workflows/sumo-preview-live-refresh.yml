name: Sumo live refresh (every basho)

# Sumo now lives on main (PR #414), so this refreshes and publishes the Sumo data on main;
# Render deploys main through the existing release pipeline. Logic lives in these scripts:
#   scripts/sumo-basho-calendar.mjs  which basho is it, and is it live
#   scripts/sumo-refresh-daily.mjs   results + next-day torikumi, both from the Sumo API
#   scripts/sumo-build-preview.mjs   roster, rankings and basho details
#   scripts/sumo-onboard-rikishi.mjs career + head-to-head data for new wrestlers
#   scripts/sumo-apply-live-bouts.mjs completed bouts into career / head-to-head
#   scripts/sumo-run-update.mjs      runs the right sequence of the above per mode
on:
  schedule:
    # Live results on the days a basho can run (8th-28th of Jan/Mar/May/Jul/Sep/Nov,
    # UTC). The script exits quietly if no basho is live.
    # Every 10 min from 13:00 to 19:59 JST: bouts finish about 18:00 JST and the
    # Sumo API posts the next day's torikumi soon after, so new data lands fast.
    - cron: '*/10 4-10 8-28 1,3,5,7,9,11 *'
    # Every 30 min the rest of the day.
    - cron: '7,37 0-3,11-23 8-28 1,3,5,7,9,11 *'
    # Daily rebuild all year (04:23 JST): roster, rankings, new-basho rollover.
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-sumo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide what to run
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          read -r BASHO PHASE < <(node scripts/sumo-basho-calendar.mjs)
          HAVE=$(node -p "require('./data/sumo/preview-details.json').bashoId")
          if [ "$BASHO" != "$HAVE" ]; then MODE=rebuild
          elif [ "${{ github.event.schedule }}" = "23 19 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE=rebuild
          elif [ "$PHASE" = "live" ]; then MODE=refresh
          else MODE=skip; fi
          echo "basho=$BASHO phase=$PHASE have=$HAVE mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Run the update
        if: steps.plan.outputs.mode != 'skip'
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ steps.plan.outputs.mode }}"
          if [ -f scripts/sumo-run-update.mjs ]; then
            node scripts/sumo-run-update.mjs "$MODE"
          elif [ "$MODE" = "rebuild" ]; then
            node --test tests/test-sumo-api-source.mjs
            node scripts/sumo-build-preview.mjs
          else
            node --test tests/test-sumo-daily.mjs tests/test-sumo-api-source.mjs
            node scripts/sumo-refresh-daily.mjs
          fi
      # Live prediction record (owner, 28 Nov 2026): save the announced day's picks before it is fought
      # and score saved picks once fought. Offline; a saved pick is never changed (assets/sumo-prediction-log.mjs).
      - name: Save and score the predictor's picks
        if: steps.plan.outputs.mode != 'skip'
        run: |
          node --test tests/test-sumo-prediction-log.mjs
          node scripts/sumo-log-predictions.mjs
      - name: Commit only the Sumo data files
        id: commit
        if: steps.plan.outputs.mode != 'skip'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BEFN Sumo daily preview"
          git config user.email "sumo-preview@users.noreply.github.com"
          git add data/sumo/preview-details.json data/sumo/rikishi-index.json \
            data/sumo/career-history.json data/sumo/research-h2h-summary.json \
            data/sumo/research-h2h-opponents.json data/sumo/research-h2h-history.json \
            data/sumo/division-stats.json data/sumo/api-trusted-status.json \
            data/sumo/jsa-torikumi.json data/sumo/prediction-log.json
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "Refresh verified-source Sumo data (${{ steps.plan.outputs.mode }})"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent change conflict; leaving main unchanged" >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          exit 1
