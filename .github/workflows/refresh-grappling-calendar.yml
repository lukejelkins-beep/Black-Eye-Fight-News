name: Refresh grappling and wrestling events
on:
  schedule:
    # Trigger both UTC choices; DST gate selects Melbourne ~07:12 year-round.
    # GitHub cron is best-effort and may be delayed.
    - cron: '12 20 * * *'
    - cron: '12 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-grappling-calendar.yml'
      - 'scripts/refresh-grappling-calendar.py'
      - 'tests/test_grappling_calendar.py'
permissions:
  contents: write
concurrency:
  group: grappling-calendar-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Melbourne seven-AM window across daylight-saving time
        id: melbourne
        env:
          GH_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo("Australia/Melbourne"))
          summer = now.utcoffset().total_seconds() == 11*3600
          expected = '12 20 * * *' if summer else '12 21 * * *'
          schedule = os.environ.get("GH_SCHEDULE", "")
          print("due=" + str(not schedule or schedule == expected).lower())
          print("local_window=" + now.strftime("%Y-%m-%d %Z"))
          PY
      - name: Validate stable IDs, official sources and conservative discovery
        if: steps.melbourne.outputs.due == 'true'
        run: python -m unittest discover -s tests -p 'test_grappling_calendar.py' -v
      - name: Check official organisers and derive strictly confirmed future RAF events
        if: steps.melbourne.outputs.due == 'true'
        run: python scripts/refresh-grappling-calendar.py
      - name: Publish confirmed event changes only
        if: steps.melbourne.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BEFN grappling calendar'
          git config user.email 'grappling-calendar-bot@users.noreply.github.com'
          git add data/grappling-events.json
          if git diff --cached --quiet; then
            echo 'No newly independently verified events; no heartbeat commit'
            exit 0
          fi
          git commit -m 'Update confirmed grappling calendar from official organisers'
          for retry in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
      - name: Upload organizer checks and review-needed discrepancies
        if: always() && steps.melbourne.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grappling-source-audit
          path: qa/grappling-calendar-source-audit.json
          if-no-files-found: warn
          retention-days: 14
